<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Book Reviews - Interactive Explorer Demo</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #2c3e50; --accent: #3498db; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background-color: var(--bg); color: #333; }
        header { background-color: var(--primary); color: white; padding: 25px 40px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        header h1 { margin: 0; font-size: 24px; }
        header p { margin: 5px 0 0 0; color: #bdc3c7; font-size: 14px; }
        
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .card label { display: block; font-weight: bold; margin-bottom: 8px; color: var(--primary); }
        select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; background: white; cursor: pointer; }

        /* Chia bảng điều khiển thành 3 cột */
        .controls-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; }
        @media (max-width: 900px) { .controls-row { grid-template-columns: 1fr; } }

        .table-card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .table-header h3 { margin: 0; color: var(--primary); }
        
        .table-container { 
            max-height: 480px; 
            overflow-y: auto; 
            border: 1px solid #eee; 
            border-radius: 6px; 
        }

        table { width: 100%; border-collapse: collapse; text-align: left; table-layout: fixed; }
        th, td { padding: 14px 16px; border-bottom: 1px solid #eee; font-size: 14px; word-wrap: break-word; overflow: hidden; }
        
        th { 
            background-color: #f1f2f6; 
            color: var(--primary); 
            font-weight: bold; 
            position: sticky; 
            top: 0; 
            z-index: 10; 
            box-shadow: inset 0 -2px 0 #dfe4ea;
        }

        tr:hover { background-color: #f8f9fa; }
        
        .rating-badge { background: #f39c12; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; display: inline-block; }
        .flag-tag { display: inline-block; padding: 3px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-top: 4px; }
        .flag-neg { background: #ffeaa7; color: #d63031; }
        .flag-pos { background: #81ecec; color: #00b894; }

        .loading { text-align: center; padding: 40px; color: #666; font-size: 15px; }

        .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
        @media (max-width: 900px) { .charts-row { grid-template-columns: 1fr; } }
        
        .chart-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .chart-card h4 { margin: 0 0 15px 0; color: var(--primary); font-size: 16px; text-align: center; }
        .chart-wrapper { position: relative; height: 280px; width: 100%; }
    </style>
</head>
<body>

    <header>
        <h1>Amazon Book Reviews - Interactive Explorer Demo</h1>
        <p>Data Science Project Visualization & Customer Review Analytics</p>
    </header>

    <div class="container">
        <!-- Bảng điều khiển 3 cột: Lọc sách | Lọc cờ NLP | Sắp xếp -->
        <div class="card">
            <div class="controls-row">
                <div>
                    <label for="bookSelect">Filter by Book Title</label>
                    <select id="bookSelect" onchange="onFilterChanged()">
                        <option value="ALL">All Books (No Filter)</option>
                    </select>
                </div>
                <div>
                    <label for="flagSelect">Filter NLP Mismatch Flags</label>
                    <select id="flagSelect" onchange="onFilterChanged()">
                        <option value="ALL">All Reviews (No Flag Filter)</option>
                        <option value="high_neg">High Rating Negative (5⭐ but Negative)</option>
                        <option value="low_pos">Low Rating Positive (1⭐ but Positive)</option>
                    </select>
                </div>
                <div>
                    <label for="sortSelect">Sort Options</label>
                    <select id="sortSelect" onchange="onFilterChanged()">
                        <option value="helpful_DESC">Helpful Votes (High to Low)</option>
                        <option value="helpful_ASC">Helpful Votes (Low to High)</option>
                        <option value="star_DESC">Star Rating (5 to 1)</option>
                        <option value="star_ASC">Star Rating (1 to 5)</option>
                        <option value="date_DESC">Review Date (Newest first)</option>
                        <option value="date_ASC">Review Date (Oldest first)</option>
                        <option value="title_ASC" id="optSortTitle">Book Title (A-Z)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Bảng hiển thị chi tiết -->
        <div class="table-card">
            <div class="table-header">
                <h3 id="tableTitle">Customer Reviews Details</h3>
            </div>
            
            <div class="table-container">
                <table>
                    <colgroup>
                        <col style="width: 25%;">
                        <col style="width: 12%;">
                        <col style="width: 43%;">
                        <col style="width: 10%;">
                        <col style="width: 10%;">
                    </colgroup>
                    <thead>
                        <tr>
                            <th>Book Title</th>
                            <th>Star Rating</th>
                            <th>Review Body</th>
                            <th>Helpful Votes</th>
                            <th>Review Date</th>
                        </tr>
                    </thead>
                    <tbody id="reviewsTableBody">
                        <tr><td colspan="5" class="loading">Loading data...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 2 Biểu đồ song song -->
        <div class="charts-row">
            <div class="chart-card">
                <h4>⭐ Star Rating Distribution</h4>
                <div class="chart-wrapper">
                    <canvas id="starChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h4>🚩 NLP Sentiment Mismatch Flags</h4>
                <div class="chart-wrapper">
                    <canvas id="flagChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentSelectedBook = "ALL";
        let starChartInstance = null;
        let flagChartInstance = null;

        window.onload = async function() {
            try {
                const response = await fetch('http://127.0.0.1:5000/api/books');
                const books = await response.json();

                const select = document.getElementById('bookSelect');
                books.forEach(title => {
                    const opt = document.createElement('option');
                    opt.value = title;
                    opt.textContent = title;
                    select.appendChild(opt);
                });

                fetchTableData();
                fetchAnalyticsData();
            } catch (error) {
                console.error("Error loading books:", error);
            }
        };

        function onFilterChanged() {
            const select = document.getElementById('bookSelect');
            currentSelectedBook = select.value;
            const optTitle = document.getElementById('optSortTitle');
            
            if (currentSelectedBook === "ALL") {
                document.getElementById('tableTitle').textContent = `Customer Reviews Details (All Books)`;
                optTitle.style.display = "block";
            } else {
                document.getElementById('tableTitle').textContent = `Customer Reviews Details for: "${currentSelectedBook}"`;
                optTitle.style.display = "none";
                
                const sortSelect = document.getElementById('sortSelect');
                if(sortSelect.value === 'title_ASC') {
                    sortSelect.value = 'helpful_DESC';
                }
            }

            fetchTableData();
            fetchAnalyticsData();
        }

        async function fetchTableData() {
            const tbody = document.getElementById('reviewsTableBody');
            tbody.innerHTML = `<tr><td colspan="5" class="loading">Loading data from database...</td></tr>`;

            const sortSelectVal = document.getElementById('sortSelect').value;
            const [sort_by, order] = sortSelectVal.split('_');
            const flagFilter = document.getElementById('flagSelect').value;

            try {
                const url = `http://127.0.0.1:5000/api/book-details?title=${encodeURIComponent(currentSelectedBook)}&sort=${sort_by}&order=${order}&flag=${flagFilter}`;
                const response = await fetch(url);
                const reviews = await response.json();

                if (reviews.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" class="loading">No reviews found matching this flag filter.</td></tr>`;
                    return;
                }

                let html = '';
                reviews.forEach(item => {
                    // Hiển thị nhãn cờ mâu thuẫn trực tiếp bên dưới sao nếu có
                    let flagBadge = '';
                    if (item.high_rating_negative_flag === 1) {
                        flagBadge = `<br><span class="flag-tag flag-neg">⚠️ High-Rating Negative</span>`;
                    } else if (item.low_rating_positive_flag === 1) {
                        flagBadge = `<br><span class="flag-tag flag-pos">💡 Low-Rating Positive</span>`;
                    }

                    html += `
                        <tr>
                            <td><strong>${item.product_title || ''}</strong></td>
                            <td><span class="rating-badge">⭐ ${item.star_rating} Stars</span>${flagBadge}</td>
                            <td style="color: #555; word-break: break-word;">${item.review_body}</td>
                            <td>👍 ${item.helpful_votes || 0}</td>
                            <td>📅 ${item.review_date || 'N/A'}</td>
                        </tr>
                    `;
                });
                tbody.innerHTML = html;

            } catch (error) {
                console.error("Error:", error);
                tbody.innerHTML = `<tr><td colspan="5" class="loading" style="color: red;">Failed to connect to backend!</td></tr>`;
            }
        }

        async function fetchAnalyticsData() {
            try {
                const url = `http://127.0.0.1:5000/api/book-analytics?title=${encodeURIComponent(currentSelectedBook)}`;
                const response = await fetch(url);
                const analytics = await response.json();

                renderStarChart(analytics.star_distribution);
                renderFlagChart(analytics.sentiment_mismatch_flags);
            } catch (error) {
                console.error("Error loading analytics:", error);
            }
        }

        function renderStarChart(dataPoints) {
            const ctx = document.getElementById('starChart').getContext('2d');
            if (starChartInstance) starChartInstance.destroy();

            starChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['1 Star', '2 Stars', '3 Stars', '4 Stars', '5 Stars'],
                    datasets: [{
                        label: 'Review Count',
                        data: dataPoints,
                        backgroundColor: ['#e74c3c', '#e67e22', '#f1c40f', '#3498db', '#2ecc71'],
                        borderRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
                }
            });
        }

        function renderFlagChart(dataPoints) {
            const ctx = document.getElementById('flagChart').getContext('2d');
            if (flagChartInstance) flagChartInstance.destroy();

            flagChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['High Rating Negative', 'Low Rating Positive'],
                    datasets: [{
                        label: 'Total Mismatch Flags',
                        data: dataPoints,
                        backgroundColor: ['#e74c3c', '#9b59b6'],
                        borderRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
                }
            });
        }
    </script>

</body>
</html>
